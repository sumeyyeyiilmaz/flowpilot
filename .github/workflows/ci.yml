name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint ve build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Next.js tiplerini üret
        run: npx next typegen

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
