# scripts/check.conf — FlowPilot doğrulama sözleşmesi (./scripts/check). Bootstrap 2026-11-27.
# Format: <name>: <command> — sırayla, ilk hatada durur. [fast] = ./scripts/check --fast profili.
# Resource hygiene inventory (docs/testing.md):
#   next typegen / next build — tek seferlik; build worker'ları süreçle birlikte biter. Next.js
#     telemetrisi ayrı (detached) bir flush süreci başlatabilir → NEXT_TELEMETRY_DISABLED=1.
#     Bıraktığı veri: .next/ (bir sonraki build üzerine yazar; gitignore'da).
#   tsc --noEmit — tek süreç, watch yok. Bıraktığı veri: tsconfig.tsbuildinfo (artımlı önbellek).
#   eslint — tek süreç, önbellek kapalı, daemon yok.
#   vitest (ilk spec ile) — `vitest run` (watch yok); tek seferlik, worker'lar süreçle biter.

# Ortam: Node 24+ ve kurulu bağımlılıklar (npm ci).
requires typegen: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
requires typegen: test -d node_modules/next

# resource hygiene: no detached telemetry flush process
typegen [fast]: NEXT_TELEMETRY_DISABLED=1 npx next typegen
typecheck [fast]: npx tsc --noEmit
lint [fast]: npm run lint

# Planlanan — ilk spec ("Test altyapısı: Vitest + Testing Library") etkinleştirir:
# requires test: test -d node_modules/vitest
# test [fast]: TZ=Europe/Istanbul npx vitest run

# resource hygiene: no detached telemetry flush process
build: NEXT_TELEMETRY_DISABLED=1 npm run build
